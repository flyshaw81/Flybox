[package]
name = "flyphoto"
version = "0.1.0"
description = "Minimal local photo library — folder as vault"
authors = ["Flyashaw"]
edition = "2021"

[lib]
name = "flyphoto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-store = "2.4.4"
image = "0.25.10"
base64 = "0.23.0"
sha2 = "0.11.0"
tiny_http = "0.12"
include_dir = "0.7"
mime_guess = "2"
url = "2.5.8"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tauri-plugin-autostart = "2.5.1"
